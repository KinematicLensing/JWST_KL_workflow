# =============================================================================
# NIRCam WFSS Pipeline Configuration
# PID 1895 – FRESCO Survey, GOODS-North, F444W grism
# =============================================================================
# Usage:
#   python run_pipeline.py configs/PID1895_FRESCO_GDN_F444W.yaml
#
# All paths may be absolute or relative to the working directory.
# Keys not recognised by PipelineConfig are silently ignored.
# =============================================================================

# ---------------------------------------------------------------------------
# Programme metadata
# ---------------------------------------------------------------------------
pid: 1895

# ---------------------------------------------------------------------------
# Source catalogue
# ---------------------------------------------------------------------------
source_catalog_path: /xdisk/timeifler/jiachuanxu/jwst/fengwu_catalog/v2_gdn_fresco_line_list_low-ground-z_Pa_Br_jades_dr5.fits

# ---------------------------------------------------------------------------
# Data directories and file patterns
# ---------------------------------------------------------------------------
data_dir:         /xdisk/timeifler/jiachuanxu/jwst/fresco_gdn

# NIRCam SW direct-imaging rate files
direct_image_dir:            /xdisk/timeifler/jiachuanxu/jwst/fresco_gdn/direct_imaging
direct_image_filename_fmt:   "jw01895002*_nrc[a-b][1-4]_rate.fits"

# NIRCam LW grism rate files (stage-1 output)
grism_data_dir:    /xdisk/timeifler/jiachuanxu/jwst/fresco_gdn/grism_F444W
grism_filename_fmt: "jw01895002*nrc[ab]long_rate.fits"

# ---------------------------------------------------------------------------
# Imaging mosaic (for direct-image cutouts in 1D extraction diagnostic plots)
# ---------------------------------------------------------------------------
image_mosaic_dir:          /xdisk/timeifler/jiachuanxu/jwst/jades/mosaics
image_mosaic_filename_fmt: "hlsp_jades_jwst_nircam_%s_%s_v5.0_drz.fits"
image_mosaic_rgb_bands:    [F090W, F200W, F444W]
image_mosaic_field:        goods-n

# ---------------------------------------------------------------------------
# Intermediate calibration and output directories
# ---------------------------------------------------------------------------
# Where lv1.5 grism files, astrometry catalogs, plots, and POM catalogs live
calibrated_dir: /xdisk/timeifler/jiachuanxu/jwst/fresco_gdn/grism_cal

# F. Sun's supportive calibration data (dispersion solution, sensitivity,
# super-sky backgrounds, speccov files for partial POM coverage)
cali_support_dir:     /home/u17/jiachuanxu/JWST_KL/nircam_wfss/data/FSun_cal

# Default POM transformation files
default_POM_trans_dir: /home/u17/jiachuanxu/JWST_KL/nircam_wfss/data/GRISM_NIRCAM

# Astrometry calibration table – if the file exists it is loaded directly;
# if not, DAOFIND is run on the SW images and the table is generated.
astrometry_cal_table: /home/u17/jiachuanxu/JWST_KL/nircam_wfss/data/FSun_cal/PID_1895_GDN_SW_wavecal.dat

# External astrometry reference catalogue (e.g. calibrated to Gaia via HST)
astrometry_ref_table: /home/u17/jiachuanxu/JWST_KL/nircam_wfss/data/FSun_cal/goods_charge_F160W_daofind.cat

# Output directory for extracted 2-D / 1-D spectra and emission-line cutouts
extract_dir: /xdisk/timeifler/jiachuanxu/jwst/fresco_gdn/extract

# ---------------------------------------------------------------------------
# Reduction parameters
# ---------------------------------------------------------------------------
grism_filter:  F444W     # NIRCam filter for grism observations
n_procs:       20        # number of parallel worker processes

# Cross-dispersion aperture half-width used during 2D spectral extraction (pix)
aperture_pix:  15.0

# Hot-pixel detection sigma threshold (higher = more conservative)
sigma_hot:     20.0

# PSF super-sampling factor for stpsf emission-line PSF models
psf_oversample: 4

# Overwrite existing lv1.5 / background files (False = skip if present)
overwrite: false
